# Release, two streams in one workflow.
#
# Store stream (Clip Wallet's own extension). For a signed version tag vX.Y.Z, builds the testnet extension
# packages in the same pinned container the reproducible-build check uses, writes SHA256SUMS, attests SLSA build
# provenance for every file (actions/attest-build-provenance, Sigstore-backed, verifiable with
# `gh attestation verify`), and opens a DRAFT GitHub release. Nothing is uploaded to any store.
#
# Kit stream (@clip-wallet/* and create-clip-wallet on npm; the only way they reach npm). On every push to main,
# Changesets opens or updates a "Version packages" pull request (pnpm version-packages: versions, changelogs, and the
# Scaffold-HBAR template pinned to the new version). Publishing happens only from a signed version tag: after that
# pull request is merged, the same tag runs pnpm release (pack-all: build + manifest and tarball checks, then
# changeset publish) with npm provenance, so every tarball carries a Sigstore-signed attestation naming this
# repository, this workflow and the tagged commit. Versions already on npm are skipped.
#
# Tags must be annotated and signed (`git tag -s vX.Y.Z -m "Clip Wallet vX.Y.Z"`, SSH or GPG signing key
# registered on GitHub). verify-tag refuses an unsigned or unverified tag, a version that differs from
# apps/extension/package.json, or a missing CHANGELOG.md section; both streams' tag jobs need it.
#
# Every third-party action is pinned by full commit SHA; the tag is in the trailing comment.
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  NODE_VERSION: "24"

jobs:
  # ---- Kit stream, main: the "Version packages" pull request (no publishing here) ----
  version-packages:
    name: changesets version pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the changeset-release/main branch
      pull-requests: write # the "Version packages" pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Both streams, tags: refuse anything but a signed tag that matches the version ----
  verify-tag:
    name: tag is signed and matches the version
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Version, changelog
        id: v
        run: |
          version="${TAG#v}"
          ext="$(node -p "require('./apps/extension/package.json').version")"
          [ "$ext" = "$version" ] || { echo "::error::apps/extension/package.json is $ext, tag is $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag is annotated and its signature verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          [ "$(jq -r .object.type <<<"$ref")" = "tag" ] || { echo "::error::$TAG is a lightweight tag; use git tag -s"; exit 1; }
          tag="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")"
          verified="$(jq -r .verification.verified <<<"$tag")"
          reason="$(jq -r .verification.reason <<<"$tag")"
          [ "$verified" = "true" ] || { echo "::error::tag signature not verified by GitHub ($reason)"; exit 1; }
          echo "$TAG: signed, verified ($reason)"

  # ---- Store stream ----
  build:
    name: build store packages (pinned container)
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Same image and digest as scripts/repro-check.sh, so a release can be rebuilt byte for byte.
    container: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build and package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          pnpm install --frozen-lockfile --filter "@clip-wallet/extension..."
          pnpm --filter @clip-wallet/extension package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.TAG }}
          path: apps/extension/release/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: provenance and draft release
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # draft release
      id-token: write # Sigstore signing for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.TAG }}
          path: dist
      - name: Check SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          {
            echo "Clip Wallet $TAG (testnet build). Test networks only."
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| clip-wallet-${VERSION}-chrome.zip | Chrome Web Store, Microsoft Edge Add-ons |"
            echo "| clip-wallet-${VERSION}-firefox.zip | addons.mozilla.org |"
            echo "| clip-wallet-${VERSION}-source.zip | AMO source submission (git archive of the tag) |"
            echo
            echo "Verify:"
            echo '```sh'
            echo "sha256sum --check SHA256SUMS"
            echo "gh attestation verify clip-wallet-${VERSION}-chrome.zip --repo ${GITHUB_REPOSITORY}"
            echo "git verify-tag ${TAG}"
            echo "scripts/repro-check.sh ${TAG}   # rebuild twice and compare (same CPU architecture as the release: x86_64)"
            echo '```'
            echo
            echo '```'
            cat dist/SHA256SUMS dist/TREE-DIGESTS dist/BUILD-INFO
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Clip Wallet $TAG" --notes-file notes.md dist/*

  # ---- Kit stream, tags: npm publish with provenance ----
  npm:
    name: npm publish with provenance (changesets)
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC → Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Version packages pull request is merged (no pending changesets)
        run: |
          pending="$(find .changeset -name '*.md' ! -name README.md)"
          [ -z "$pending" ] || { echo "::error::pending changesets; merge the \"chore: version packages\" pull request, then tag again:"; echo "$pending"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test, harness
        run: pnpm typecheck && pnpm test && pnpm harness
      - name: pack-all, then changeset publish (versions already on npm are skipped)
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
