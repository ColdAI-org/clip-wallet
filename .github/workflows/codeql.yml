# CodeQL (security-extended) for the TypeScript in packages/, apps/ and services/.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "services/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - packages
              - apps/extension/src
              - apps/extension/scripts
              - services
              - tools
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/test"
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "packages/route/src/vendor"
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
