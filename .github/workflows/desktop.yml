# Clip Wallet desktop: build, unit-test, package and smoke-test on macOS, Windows and Linux.
# Signing / notarization secrets are optional: without them the artifacts are unsigned (electron-builder.config.cjs).
# The e2e suite drives the real app with Playwright's Electron support (Linux under xvfb).
name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/desktop/**", "packages/**", "tools/harness/**", "pnpm-lock.yaml", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: --mac
          - os: windows-latest
            dist: --win
          - os: ubuntu-latest
            dist: --linux
    defaults:
      run:
        shell: bash
    env:
      # Public build-time values only (src/shared/app-config.ts); unset = WalletConnect says it isn't switched on.
      CLIP_WC_PROJECT_ID: ${{ vars.CLIP_WC_PROJECT_ID }}
      # Chromium extension ids allowed to use Clip Desktop over native messaging (store ids, comma-separated).
      CLIP_EXTENSION_IDS: ${{ vars.CLIP_EXTENSION_IDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Linux packages for Electron, the keyring (safeStorage) and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libsecret-1-0 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor), which Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Typecheck and unit tests
        run: |
          pnpm --filter @clip-wallet/desktop typecheck
          pnpm --filter @clip-wallet/desktop test

      - name: Harness
        if: runner.os == 'Linux'
        run: pnpm harness

      - name: Build
        run: pnpm --filter @clip-wallet/desktop build

      - name: End-to-end (Playwright, real app)
        working-directory: apps/desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum -- pnpm exec playwright test
          else
            pnpm exec playwright test
          fi

      - name: Package
        working-directory: apps/desktop
        env:
          # macOS: Developer ID + notarization (optional)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: code signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.dist }} --config electron-builder.config.cjs --publish never

      - name: Smoke-test the packaged app (starts, serves the wallet page, quits)
        working-directory: apps/desktop
        run: |
          case "$RUNNER_OS" in
            macOS)   APP="release/mac-arm64/Clip Wallet.app/Contents/MacOS/Clip Wallet"; [ -x "$APP" ] || APP="release/mac/Clip Wallet.app/Contents/MacOS/Clip Wallet" ;;
            Windows) APP="release/win-unpacked/Clip Wallet.exe" ;;
            Linux)   APP="release/linux-unpacked/clip-wallet" ;;
          esac
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run --auto-servernum -- node scripts/smoke-packaged.mjs "$APP"; else node scripts/smoke-packaged.mjs "$APP"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: clip-wallet-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-wallet-desktop-screenshots-${{ runner.os }}
          path: apps/desktop/screenshots/
          retention-days: 14
