# Keeps the SHA-pinned actions and the pnpm lockfile current. Each update is a reviewed pull request; CI,
# the reproducible-build check and CodeQL run on it like on any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Expo's native modules move together with the SDK; never bump them one at a time.
      expo:
        patterns: ["expo", "expo-*", "react-native", "react-native-*", "@react-native/*", "jest-expo"]
        update-types: ["patch"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
