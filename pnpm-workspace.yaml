packages:
  - packages/*
  - apps/*
  - templates/*
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  protobufjs: false
  unrs-resolver: false
  # Optional native add-ons pulled in by @near-js/crypto and ws (kit-modules dev deps); pure-JS fallbacks are used.
  bufferutil: false
  secp256k1: false
  utf-8-validate: false
